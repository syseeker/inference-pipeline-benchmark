# RTX PRO 6000 Blackwell (Server Edition)
#
# Schema (one GPU = one yaml):
#   models:          one block per candidate model. Keys = stable ids.
#                    `backend_args` is the rare per-backend launch flag a
#                    model needs (e.g. runtime quant when the weights are
#                    BF16 but the runtime should load them as FP8).
#   default_model:   pointer into `models`. Single-run target — change this
#                    one line and re-run to swap the model on all backends.
#   backends:        launcher params (HTTP url, port, extra_args).
#                    `variants` are additive flag sets used by sweeps and
#                    by `--variant <name>` for one-off comparisons.
#   sweeps:          named ordered lists of rounds. The runner iterates
#                    each round across the listed backends. Use sweeps to
#                    auto-run multi-model or multi-variant benchmarks in
#                    one session. Run via `--sweep <name>`.
#   aux:             placeholder blocks for tools wired up later.
#
# See docs/models.md for per-GPU pick rationale, docs/capacity.md for fit.

display_name: "RTX PRO 6000 Blackwell Server Edition"
arch: blackwell
vram_gb: 96
mem_type: GDDR7
peak_bandwidth_tbps: 1.6      # check vs. datasheet at run time
nvlink: false
pcie_gen: 5
mig_supported: true

driver: "unknown"             # filled in by scripts/gpu_probe.sh
cuda: "unknown"

tensor_parallel: 1

# ─── Models ────────────────────────────────────────────────────────────
# All HF ids — vllm, sglang, and trtllm-serve all pull on first launch
# into $HF_HOME (default ~/.cache/huggingface/hub/) and share the cache.
models:
  qwen3-vl-32b-fp8:
    hf_id: "Qwen/Qwen3-VL-32B-Instruct-FP8"
    weights_gb: 35.5              # safetensors total on the hub (33.1 GiB)
    family: "qwen3-vl"
    role: "vlm-headline"
    quantization: "fp8"
    notes: "33GB weights + comfortable KV/ctx room on 96GB."
    # 32K cap: model's HF default is 256K, KV reservation for that won't fit
    # on 96GB next to 33GB weights. 32K is 16x our scenario prompts.
    # `--no-enable-prefix-caching`: Qwen3-VL deepstack + chunked prefill
    # bug; remove once upstream fixes (see SMOKE_TESTS.md).
    backend_args:
      vllm: ["--max-model-len=32768", "--no-enable-prefix-caching"]
      sglang: ["--context-length=32768"]

  qwen3-vl-32b-bf16:
    hf_id: "Qwen/Qwen3-VL-32B-Instruct"
    family: "qwen3-vl"
    role: "vlm-accuracy-baseline"
    quantization: "bf16"
    notes: "BF16 reference for quant-accuracy delta studies."
    # BF16 weights = ~64GB → only ~17GB left for KV. 16K context is a safe
    # cap; bumping to 32K may force vLLM to refuse startup on this GPU.
    backend_args:
      vllm: ["--max-model-len=16384", "--no-enable-prefix-caching"]
      sglang: ["--context-length=16384"]

  qwen3-vl-30b-a3b-fp8:
    hf_id: "Qwen/Qwen3-VL-30B-A3B-Instruct-FP8"
    family: "qwen3-vl"
    role: "vlm-moe"
    quantization: "fp8"
    notes: "MoE (30B total / 3B active); ~31GB at FP8, sweet spot on 96GB. Bandwidth-thesis stress test. TRT-LLM 1.2.1 cannot run it on Blackwell (SM_120) — see comment below."
    unsupported_backends:
      trtllm: "TRT-LLM 1.2.1 fused-MoE (CUTLASS→DeepGEMM JIT) hard-checks SM_90; PRO 6000 is SM_120"
    #
    # ⚠ TRT-LLM 1.2.1 incompatibility (Blackwell SM_120 only):
    # the default `CUTLASS` fused-MoE backend dispatches to a DeepGEMM JIT
    # path whose compiler hard-checks for SM_90 (Hopper). On a PRO 6000
    # (SM_120) startup fails with:
    #   `DeepGEMM only supports Hopper (SM90) architectures, but current
    #    device compute capability is 120.`
    # at `fused_moe_cutlass.py:441 → run_moe`. Same kernel-availability
    # shape of issue as Nemotron-Omni FP8 on SGLang SM_120.
    # Sweeps below pin `backends: [vllm, sglang]`. A per-model
    # trtllm-vlm.yml override that sets `moe_config.backend: DEEPGEMM`
    # (or TRITON/TRTLLM) might unblock TRT-LLM in the future, but
    # changes the global config so it's not safe without per-model
    # YAML routing — flagged in docs/findings/nemotron-omni-on-trtllm.md.
    # Detailed write-up: docs/findings/qwen3-vl-30b-a3b-fp8-on-trtllm.md (TBD).
    backend_args:
      vllm: ["--max-model-len=32768", "--no-enable-prefix-caching"]
      sglang: ["--context-length=32768"]

  qwen3.6-27b-fp8:
    hf_id: "Qwen/Qwen3.6-27B-FP8"
    family: "qwen3.6"
    role: "dense-text"
    quantization: "fp8"
    notes: "Aspirationally TRT-LLM home turf (dense + Blackwell FP8 + stable shapes). TRT-LLM 1.2.1 cannot load it yet — see comment below."
    # Smaller weights (~27GB) leave more room for KV; could go to 65536 if
    # a longer-context experiment needs it.
    #
    # ⚠ TRT-LLM 1.2.1 incompatibility: the checkpoint reports model_type
    # `qwen3_5` (hybrid attention + Mamba/SSM). The transformers build TRT-LLM
    # ships against doesn't register that arch, so loading fails with
    # `KeyError: 'qwen3_5'`. vLLM and SGLang have native support. See
    # docs/findings/qwen3.6-on-trtllm.md.
    unsupported_backends:
      trtllm: "TRT-LLM 1.2.1 transformers registry missing qwen3_5 arch (KeyError on load)"
    backend_args:
      vllm: ["--max-model-len=32768"]
      sglang: ["--context-length=32768"]

  gemma-4-31b-it-fp8:
    hf_id: "RedHatAI/gemma-4-31B-it-FP8-block"
    family: "gemma-4"
    # vLLM registers Gemma4ForConditionalGeneration, but transformers 4.57.6
    # has no `gemma4` arch, so the checkpoint fails to load before any GPU
    # work. Revisit after a transformers bump — not under a running study,
    # since vLLM pins it and every other tenant here serves against 4.57.6.
    unsupported_backends:
      vllm: "transformers 4.57.6 has no gemma4 architecture; needs a version bump"
    role: "vlm-google"
    quantization: "fp8"
    notes: "Google Gemma 4 31B dense VLM (text+image+video, 256K ctx). RedHatAI FP8-block community quant (Google ships BF16 only). ~31GB at FP8 → fits 96GB with comfortable KV room; cross-vendor twin to qwen3-vl-32b-fp8 and brings the first video-capable modality into the matrix."
    # ⚠ TRT-LLM 1.2.1 incompatibility (expected, unverified on this host):
    # Gemma 4 is an April-2026 release; TRT-LLM 1.2.1's bundled transformers
    # almost certainly doesn't register the `gemma4` arch — same KeyError
    # failure mode as qwen3_5 (qwen3.6-27b-fp8) and NemotronH_Nano_Omni
    # (nemotron-omni-fp8). Pinned out until TRT-LLM is bumped; revisit then.
    # When unblocked, also check whether Gemma3's per-arch trtllm constraints
    # carry to Gemma 4 (FLASHINFER attn backend, chunked prefill off — see
    # TensorRT-LLM/examples/models/core/multimodal/README.md §Gemma3).
    unsupported_backends:
      trtllm: "TRT-LLM 1.2.1 transformers registry expected to be missing gemma4 arch (Apr-2026 release); revisit after TRT-LLM bump"
    backend_args:
      vllm: ["--max-model-len=32768"]
      sglang: ["--context-length=32768"]

  nemotron-omni-fp8:
    hf_id: "nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-FP8"
    family: "nemotron"
    role: "nv-multimodal-moe"
    quantization: "fp8"
    notes: "NV-tuned multimodal MoE on NV silicon. Calibrated FP8 checkpoint published by NVIDIA — no runtime quant needed (NVFP4 variant also available for smaller GPUs)."
    # HF repo ships custom modeling code; vLLM and SGLang refuse to load
    # without --trust-remote-code (HF default is off).
    # First-run cold cache: ~280s download + ~150s safetensors load + compile
    # blew past the 600s default. Bump to 30 min; subsequent runs hit the
    # HF cache and finish in ~120s.
    ready_timeout_s: 1800
    # --no-enable-flashinfer-autotune: vLLM's flashinfer autotuner uses a
    # cuBLASLt-based bmm_fp8 baseline (tactic -1) that aborts with
    # "library was not initialized" on SM_120 (RTX PRO 6000 Blackwell is
    # workstation/pro Blackwell, not data-center SM_100). Disabling
    # autotune lets the SM_120 cutlass FP8 path run directly.
    #
    # ⚠ sglang incompatible on this GPU: the fused-MoE triton kernel for
    # ModelOpt FP8 (modelopt_quant.py:1104 → moe_runner/triton.py:147)
    # has no tuning config for RTX PRO 6000; the default it falls back to
    # asks for 147 KB shared memory per SM but SM_120 has ~100 KB →
    # `OutOfResources` at JIT compile time. --moe-runner-backend is
    # ignored on the modelopt path; --disable-cuda-graph only delays the
    # crash to first generation request.
    #
    # ⚠ trtllm 1.2.1 incompatible: the PyTorch backend doesn't register
    # `NemotronH_Nano_Omni_Reasoning_V3` →
    # `ValueError: Unknown architecture for AutoModelForCausalLM`.
    # Same class of issue as the qwen3_5 arch gap.
    #
    # Net effect: this GPU's only working path is vllm until either (a)
    # sglang ships an SM_120 fused-MoE config or modelopt_quant honors
    # --moe-runner-backend, and (b) trtllm registers the NemotronH
    # multimodal arch.
    unsupported_backends:
      sglang: "Triton fused-MoE asks 147KB shmem on modelopt FP8; SM_120 has ~100KB → OutOfResources at JIT"
      trtllm: "TRT-LLM 1.2.1 PyTorch backend rejects NemotronH_Nano_Omni_Reasoning_V3 arch"
    backend_args:
      vllm: ["--max-model-len=32768", "--trust-remote-code", "--no-enable-flashinfer-autotune"]
      sglang: ["--context-length=32768", "--trust-remote-code"]

  # ─── NitroGen policy models ────────────────────────────────────────────
  # The NitroGen MODEL (500M params, ckpt nvidia/NitroGen:ng.pt) at different
  # precision/denoise-step settings. `quantization` is recorded on the result;
  # precision/--steps ride on `backend_args.nitrogen` (the `nitrogen` family key,
  # applied to every nitrogen-* engine backend). The execution engine
  # (eager/compile/cudagraph/tensorrt/onnx) is the BACKEND this model runs on,
  # not part of the model. bf16-16step is the accuracy/latency reference.
  nitrogen-500m-bf16:
    family: "nitrogen"
    role: "policy-reference"
    ckpt: "nvidia/NitroGen:ng.pt"          # `hf download nvidia/NitroGen ng.pt` on the instance
    quantization: "bf16"
    notes: "BF16 reference; accuracy-vs-gold baseline for the quant delta."
    # bf16 uses PyTorch autocast — no calibrated ONNX artifact needed.
    # TRT/ONNX exec paths require a quantized (fp8/nvfp4) ONNX; bf16 has none.
    unsupported_backends:
      nitrogen-tensorrt: "bf16 has no calibrated ONNX artifact; use nitrogen-eager/compile/cudagraph"
      nitrogen-onnx:     "same — bf16 has no calibrated ONNX artifact"
    backend_args:
      nitrogen: ["--precision=bf16", "--steps=16"]
  nitrogen-500m-fp8:
    family: "nitrogen"
    role: "policy-quant"
    ckpt: "nvidia/NitroGen:ng.pt"
    quantization: "fp8"
    notes: "FP8 quant of the DiT via TRT/ONNX artifact (syseeker-at-nv/nitrogen-quant). Requires nitrogen-tensorrt or nitrogen-onnx — eager/compile/cudagraph exec paths run PyTorch autocast only and do not apply FP8 weight quantization."
    # eager/compile/cudagraph map Precision.FP8 → bfloat16 autocast internally
    # (see nitrogen_exec.py _DTYPE_NAMES). That is NOT fp8; it silently runs
    # bf16 with a wrong label. Block those combos so only the real quant
    # paths (TRT/ONNX artifact from syseeker-at-nv/nitrogen-quant) are used.
    unsupported_backends:
      nitrogen-eager:     "eager exec ignores fp8 precision — runs bf16 autocast; use nitrogen-500m-bf16 for eager"
      nitrogen-compile:   "same — torch.compile does not apply FP8 weight quant"
      nitrogen-cudagraph: "same — cudagraph exec does not apply FP8 weight quant"
    backend_args:
      nitrogen: ["--precision=fp8", "--steps=16"]
  nitrogen-500m-fp8-4step:
    family: "nitrogen"
    role: "policy-quant-fast"
    ckpt: "nvidia/NitroGen:ng.pt"
    quantization: "fp8"
    notes: "FP8 + reduced denoise steps (4) — latency floor; check accuracy cost. Requires nitrogen-tensorrt or nitrogen-onnx."
    unsupported_backends:
      nitrogen-eager:     "eager exec ignores fp8 precision — runs bf16 autocast; use nitrogen-500m-bf16 for eager"
      nitrogen-compile:   "same — torch.compile does not apply FP8 weight quant"
      nitrogen-cudagraph: "same — cudagraph exec does not apply FP8 weight quant"
    backend_args:
      nitrogen: ["--precision=fp8", "--steps=4"]
  nitrogen-500m-nvfp4:
    family: "nitrogen"
    role: "policy-quant-blackwell"
    ckpt: "nvidia/NitroGen:ng.pt"
    quantization: "nvfp4"
    notes: "NVFP4 — Blackwell-only datatype (PRO 6000 / 5090; not H200 SM_90). Requires nitrogen-tensorrt or nitrogen-onnx."
    # NVFP4's ONNX op is shipped as a TRT plugin that's not in the default
    # registry of `tensorrt==10.16.*` (the wheel our [nitrogen-quant] extra
    # pulls). OnnxParser raises "Plugin not found" during compile. Either
    # bump tensorrt to a release that ships the FP4 plugin, or wait for
    # modelopt to ship the matching plugin .so alongside its exports.
    # FP8 paths work on the same TRT version — only NVFP4 is gated here.
    unsupported_backends:
      nitrogen-eager:     "eager exec ignores nvfp4 precision — runs bf16 autocast; use nitrogen-500m-bf16 for eager"
      nitrogen-compile:   "same — torch.compile does not apply NVFP4 weight quant"
      nitrogen-cudagraph: "same — cudagraph exec does not apply NVFP4 weight quant"
      nitrogen-tensorrt:  "NVFP4 plugin not in tensorrt==10.16 default registry; needs newer TRT or modelopt-bundled plugin"
      nitrogen-onnx:      "same — ORT routes NVFP4 graph through TRT-EP which hits the same plugin"
    backend_args:
      nitrogen: ["--precision=nvfp4", "--steps=16"]

  # ─── Contention study roster ─────────────────────────────────────────
  # Customer-selected models for the multi-model co-residency study. The
  # target is consumer/prosumer hardware, so these are deliberately SMALL
  # enough that 1 CV + 1 LLM/VLM fit together — this is a co-residency
  # study, not a best-latest-model study. Do not modernise these without
  # asking; see skills/gpu-contention-benchmark/reference/model-catalogue.md.
  #
  # This GPU (96 GB) carries the full ladder. The 32 GB profile omits
  # 32b/72b on VRAM grounds — that is scoping, not removal.
  #
  # `weights_gb` is the measured/estimated weight footprint of the
  # checkpoint on the card (params × bytes-per-param, AWQ ≈ 0.3× BF16 —
  # see skills/gpu-contention-benchmark/reference/model-catalogue.md
  # "VRAM arithmetic"). It exists so a colocation can size each tenant's
  # `gpu_memory_utilization` as weights + a KV budget held CONSTANT across
  # the comparison set (docs/contention.md §2b) instead of by hand.
  # It is an estimate: the runner records `vram_after_load_gb` per tenant,
  # and that measurement is the ground truth to correct these against.

  qwen2.5-7b:
    hf_id: "Qwen/Qwen2.5-7B-Instruct"
    family: "qwen2.5"
    quantization: "bf16"
    role: "contention-llm-small"
    weights_gb: 15.2            # 7.6B × 2 bytes (BF16)
    backend_args:
      vllm: ["--max-model-len=8192"]
      sglang: ["--context-length=8192"]
  qwen2.5-14b:
    hf_id: "Qwen/Qwen2.5-14B-Instruct"
    family: "qwen2.5"
    quantization: "bf16"
    role: "contention-llm-size-scaling"
    weights_gb: 29.5            # 14.7B × 2 bytes (BF16)
    backend_args:
      vllm: ["--max-model-len=8192"]
      sglang: ["--context-length=8192"]
  # NOTE: the original design lists `qwen2.5-27b`. That checkpoint does not
  # exist — the Qwen2.5 ladder is 0.5/1.5/3/7/14/32/72B. Corrected to 32B.
  qwen2.5-32b:
    hf_id: "Qwen/Qwen2.5-32B-Instruct"
    family: "qwen2.5"
    quantization: "bf16"
    role: "contention-llm-size-scaling"
    weights_gb: 65.5            # 32.8B × 2 bytes (BF16) — heaviest of the ladder
    backend_args:
      vllm: ["--max-model-len=8192"]
      sglang: ["--context-length=8192"]
  qwen2.5-72b:
    hf_id: "Qwen/Qwen2.5-72B-Instruct-AWQ"
    family: "qwen2.5"
    quantization: "awq"
    role: "contention-memory-pressure-anchor"
    notes: "AWQ ~45 GB. BF16 (145 GB) needs >=2 GPUs. Anchors the VRAM-pressure curve."
    weights_gb: 41.6            # from the note above (AWQ ≈ 0.3× BF16)
    backend_args:
      vllm: ["--max-model-len=8192"]
      sglang: ["--context-length=8192"]
  gemma2-9b:
    hf_id: "google/gemma-2-9b-it"
    family: "gemma2"
    quantization: "bf16"
    role: "contention-llm-cross-arch"
    notes: "Gated repo — needs `hf auth login` with licence accepted."
    weights_gb: 18.4            # 9.2B × 2 bytes (BF16)
    backend_args:
      vllm: ["--max-model-len=8192"]
      sglang: ["--context-length=8192"]
  llama3.1-8b:
    hf_id: "meta-llama/Llama-3.1-8B-Instruct"
    family: "llama3"
    quantization: "bf16"
    role: "contention-llm-cross-arch"
    notes: "Gated repo. Validates that contention behaviour generalises beyond Qwen."
    weights_gb: 16.1            # 8.03B × 2 bytes (BF16)
    backend_args:
      vllm: ["--max-model-len=8192"]
      sglang: ["--context-length=8192"]
  mistral-7b:
    hf_id: "mistralai/Mistral-7B-Instruct-v0.3"
    family: "mistral"
    quantization: "bf16"
    role: "contention-llm-cross-arch"
    weights_gb: 14.5            # 7.25B × 2 bytes (BF16)
    backend_args:
      vllm: ["--max-model-len=8192"]
      sglang: ["--context-length=8192"]
  qwen2.5-vl-7b:
    hf_id: "Qwen/Qwen2.5-VL-7B-Instruct-AWQ"
    family: "qwen2.5-vl"
    quantization: "awq"
    role: "contention-vlm-video"
    notes: "Official AWQ. Native video input — carries the VLM prefill-burst dimension."
    weights_gb: 7.0             # 8.3B AWQ ≈ 0.3× BF16, plus the FP16 vision tower
    # 32768, not 16384: the 10s/720p clip in vlm_video_long expands to 19184
    # tokens, so at 16384 EVERY request came back 400 "Input length (19184)
    # exceeds model's maximum context length" — measured, not estimated.
    # A video VLM's context has to fit the video it is given.
    backend_args:
      vllm: ["--max-model-len=32768"]
      sglang: ["--context-length=32768"]

  # Customer pick that cannot serve the dimension it was chosen for. Kept —
  # it loads and serves IMAGE workloads fine — but video rounds skip with a
  # reason instead of crashing mid-sweep. paligemma2 is 28B (not 32B), is a
  # `-pt-` base checkpoint, and vLLM's paligemma.py raises
  # ValueError("Only image modality is supported").
  gemma-vlm-32b:
    hf_id: "google/paligemma2-28b-pt-896"
    family: "paligemma2"
    quantization: "bf16"
    role: "contention-ilm"
    notes: "Customer-selected. Image-only; see unsupported_workloads. Gated repo."
    unsupported_backends:
      sglang: "no PaliGemma implementation in SGLang"
    unsupported_workloads:
  # Prompt token counts below are measured with cl100k_base, not estimated.
  #
  # llm_long is NOT the original text. That measured 142/109 tokens against
  # a "~1000 tok" label, which would have made the long arm of the prompt-length
  # dimension barely longer than the short one, and would have pitted a
  # ~140-token LLM prefill against the VLM's 40-frame burst in the one
  # experiment built to contrast prefill lengths. Replaced with the same two
  # questions asked at the depth the label implied; the originals are preserved
  # verbatim in scripts/build_contention_prompts.py, which regenerates these
  # files. Delete the override there to go back.
      vlm_video_short: "paligemma2 is image-only — vLLM raises 'Only image modality is supported'; use a video VLM (qwen2.5-vl-7b)"
      vlm_video_long: "paligemma2 is image-only — vLLM raises 'Only image modality is supported'; use a video VLM (qwen2.5-vl-7b)"

  # ─── CV models (Triton tenants) ──────────────────────────────────────
  # Served from Triton, never from vLLM/SGLang/TRT-LLM — they are not
  # language models. `unsupported_backends` states that once per model so a
  # mis-specified tenant fails with a reason rather than at server launch.
  yolov8-n:
    hf_id: "ultralytics/yolov8n"
    family: "cv-detect"
    quantization: "fp16"
    role: "contention-cv-launch-bound"
    notes: "Many short kernels — the scheduler/launch-pressure aggressor."
    unsupported_backends: &cv_only
      vllm: "CV model — not a language model; served via Triton"
      sglang: "CV model — not a language model; served via Triton"
      trtllm: "CV model — not a language model; served via Triton"
  yolov8-l:
    hf_id: "ultralytics/yolov8l"
    family: "cv-detect"
    quantization: "fp16"
    role: "contention-cv-launch-bound"
    unsupported_backends: *cv_only
  dinov2-base:
    hf_id: "facebook/dinov2-base"
    family: "cv-embed"
    quantization: "fp16"
    role: "contention-cv-bandwidth-bound"
    notes: "Large GEMMs + attention — the bandwidth aggressor. Fixed 224px patch grid."
    unsupported_backends: *cv_only
  dinov2-large:
    hf_id: "facebook/dinov2-large"
    family: "cv-embed"
    quantization: "fp16"
    role: "contention-cv-bandwidth-bound"
    unsupported_backends: *cv_only
  rfdetr-medium:
    hf_id: "roboflow/rf-detr-medium"
    family: "cv-detect"
    quantization: "fp16"
    role: "contention-cv-detect"
    notes: "RFDETRBase was deprecated 2025-07-23; Medium is the comparable successor."
    unsupported_backends: *cv_only
  paddleocr:
    hf_id: "PaddlePaddle/PP-OCRv5"
    family: "cv-ocr"
    quantization: "fp16"
    role: "contention-cv-ocr"
    notes: >-
      Triton PYTHON backend only. PaddleOCR's TensorRT path pins TensorRT
      8.6.1.6 + CUDA 11.8, which cannot coexist with the Triton 26.07 stack
      (CUDA 13.3 / TRT 11) — so it runs unoptimised rather than not at all.
    unsupported_backends: *cv_only
  kosmos-2.5:
    hf_id: "microsoft/kosmos-2.5"
    family: "ilm"
    quantization: "bf16"
    role: "contention-ilm"
    # 5.5 GB checkpoint (2.7B params). Present so kosmos counts in the VRAM
    # pre-flight — it had no entry, so its footprint was invisible to the cap
    # arithmetic in the four colocations that use it.
    weights_gb: 5.5
    # MEASURED sustained throughput on PRO 6000: 0.133 requests/second from a
    # single Triton instance, solo on the card, with 312 ms of server queueing.
    # NOT the ~0.45 that 2205 ms per request implies: arrivals are Poisson, so
    # they bunch, and a 2.2 s server cannot absorb a burst — the sustainable
    # rate is well under 1/service_time.
    #
    # Tenants run at 0.1 (about 75% utilisation) so the tenant has headroom to
    # lose. A tenant pinned at its ceiling cannot show degradation: a neighbour
    # arriving only deepens a queue that was already there, and the ratio comes
    # back near 1.0 for the wrong reason. At 0.2 it was 150% of capacity and
    # did exactly that.
    #
    # The ILM colocations run a 600 s window because of this rate: at 0.1 rps a
    # 180 s window yields 18 requests, and a p95 over 18 samples is the
    # second-worst value rather than a percentile. 600 s gives 60.
    #
    # Raising the rate means raising instance_count with it, which changes the
    # tenant's VRAM claim and therefore what every colocation using it
    # measures. That is a different experiment, not a tuning knob.
    notes: >-
      Triton PYTHON backend. Absent from vLLM's model registry and there is no
      kosmos*.py in either the vLLM or SGLang tree — the "vLLM supported" note
      on its HF page is the generic deploy widget, not real support.
    unsupported_backends: *cv_only

# Headline model for ad-hoc single runs. Sweeps below override this per round.
default_model: qwen3-vl-32b-fp8

# ─── Backends ──────────────────────────────────────────────────────────
# Launcher params only. Model HF id resolved from the active round at run
# time (sweep round, --model override, or default_model).
backends:
  vllm:
    base_url: "http://localhost:8000/v1"
    port: 8000
    # Backend-level args here are GPU-shape-only (memory ceiling +
    # concurrency hint). Anything model-specific lives on
    # `models.<id>.backend_args.vllm`:
    #   --max-model-len     — per-model, since the cap depends on weight
    #                         footprint vs. this GPU's VRAM.
    #   --no-enable-prefix-caching
    #                       — per-model. vLLM's default is ON. Qwen3-VL
    #                         hits a deepstack/chunked-prefill bug with
    #                         prefix caching on (see SMOKE_TESTS.md
    #                         "Common failures"); we disable on those
    #                         models specifically. Other multimodal
    #                         models (Nemotron Omni) use a different
    #                         architecture and stay on the vLLM default.
    #   --quantization      — per-model runtime override (e.g., loading
    #                         BF16 weights as FP8).
    extra_args:
      - "--gpu-memory-utilization=0.90"
      - "--max-num-seqs=32"
    variants:
      eager: ["--enforce-eager"]
      chunked_off: ["--no-enable-chunked-prefill"]

  sglang:
    base_url: "http://localhost:30000/v1"
    port: 30000
    # Per-request context caps live on each model's backend_args block
    # (SGLang flag: `--context-length`). Same reasoning as vllm.
    extra_args: []
    variants: {}

  # Triton Inference Server — CV tenants only (contention study).
  #
  # Why Triton here and native servers for LLM/VLM: Triton has no SGLang or
  # llama.cpp backend, and an LLM served by vLLM is already its own process,
  # so an all-Triton topology can't hold the stack anyway. CV models are
  # where Triton genuinely earns its place — clean ONNX/TensorRT export,
  # dynamic batching, and per-request server-side timing decomposition
  # (queue / compute-input / compute-infer / compute-output) which is
  # exactly the attribution a contention study needs.
  #
  # Ports avoid vLLM's 8000. Triton's gRPC listener is port+1 (8101) and
  # metrics port+2 (8102); perf_analyzer talks gRPC by default.
  #
  # `port` here is the GPU-0 base. With tenants placed across cards the
  # orchestrator runs one container per GPU and offsets each one's port block
  # by 10 × device (GPU 1 → 8110/8111/8112), because two containers cannot
  # bind the same host port. Nothing changes for a config that omits `device:`.
  #
  # ⚠ Launch with --allow-client-shm=true. Client shared memory has been
  # DISABLED by default since Triton 26.04, and without it large CV input
  # tensors carry serialization overhead that reads as a model regression.
  #
  # `variants` selects the execution backend per round — see
  # `triton_backend:` on a colocation tenant (tensorrt | onnx | python).
  triton:
    transport: triton
    family: triton
    base_url: "http://localhost:8100"
    port: 8100
    extra_args:
      - "--allow-client-shm=true"
    variants: {}

  # NitroGen execution-engine backends. One ZMQ runtime (serve_nitrogen.py) per
  # engine; `transport: zmq` tells the runner to use NitrogenReasoner (not an
  # OpenAI client) and tells run_all_scenarios.sh to launch serve_nitrogen.py.
  # Each backend = one engine that RUNS the NitroGen model (parallel to how vllm
  # runs Qwen3-VL). You run NitroGen on exactly ONE of these per run, not a combo.
  # `family: nitrogen` lets the model's `backend_args.nitrogen` (precision/steps)
  # apply to all of them. `--exec` selects the engine; `--seed` pins denoising.
  # One distinct port per engine so a stale orphan from one round (e.g. a
  # zombie kernel LISTEN socket after a crash) can't block the next round.
  nitrogen-eager:
    transport: zmq
    family: nitrogen
    base_url: "tcp://localhost:5560"
    port: 5560
    extra_args: ["--exec=eager", "--seed=0"]
  nitrogen-compile:
    transport: zmq
    family: nitrogen
    base_url: "tcp://localhost:5561"
    port: 5561
    extra_args: ["--exec=compile", "--seed=0"]
  nitrogen-cudagraph:
    transport: zmq
    family: nitrogen
    base_url: "tcp://localhost:5562"
    port: 5562
    extra_args: ["--exec=cudagraph", "--seed=0"]
  nitrogen-tensorrt:
    transport: zmq
    family: nitrogen
    base_url: "tcp://localhost:5563"
    port: 5563
    extra_args: ["--exec=tensorrt", "--seed=0"]
  nitrogen-onnx:
    transport: zmq
    family: nitrogen
    base_url: "tcp://localhost:5564"
    port: 5564
    extra_args: ["--exec=onnxruntime", "--seed=0"]

  trtllm:
    base_url: "http://localhost:8002/v1"
    port: 8002
    # `backend:` selects the trtllm-serve execution path. Allowed values:
    #   pytorch     — PyTorch dispatch (HF weights direct; day-0 model coverage,
    #                 only path supporting Qwen3-VL / Qwen3.6 / Nemotron Omni).
    #   trtllm      — AOT-compiled TRT engine (legacy; dense-text strong on
    #                 stable shapes, multimodal coverage limited; check
    #                 https://nvidia.github.io/TensorRT-LLM/models/supported-models.html).
    #                 Maps to trtllm-serve `--backend tensorrt`.
    #   _autodeploy — experimental auto-routing path; not for headline runs.
    backend: pytorch
    extra_args:
      - "--extra_llm_api_options=benchmarks/configs/trtllm-vlm.yml"
    variants: {}

# ─── Sweeps ────────────────────────────────────────────────────────────
# A sweep is a named ordered list of rounds. Each round can set:
#   model:    id from `models:` (defaults to `default_model`)
#   variant:  variant name from `backends.<backend>.variants` (defaults to none)
# Optional `backends:` field on the sweep limits which backends each round
# runs on; default is all three.
#
# Run via:  python -m benchmarks.runner --sweep <name>   (or --gpu rtx_pro6000 --sweep <name>)
sweeps:
  # All candidate models on all three backends. 4 rounds × 3 backends = 12 runs.
  models:
    rounds:
      # Per-backend filtering — including which (model, backend) pairs are
      # hardware/version-incompatible — is now driven by each model's
      # `unsupported_backends:` field. Sweep mode silently skips those
      # combinations. Single-round invocations (`--backends X --model Y`)
      # are also rejected via the same field.
      - model: qwen3-vl-32b-fp8
      # - model: qwen3-vl-32b-bf16
      - model: qwen3-vl-30b-a3b-fp8
      - model: qwen3.6-27b-fp8
      - model: gemma-4-31b-it-fp8
      - model: nemotron-omni-fp8

  # vllm flag-knob comparison on the default model. 3 vllm runs.
  vllm_knobs:
    backends: [vllm]
    rounds:
      - {}                          # baseline (no variant)
      - variant: eager
      - variant: chunked_off

  # NitroGen inference-optimization study: one 500M policy across execution
  # backends × precision × denoise steps. bf16/eager is the reference; each
  # other round is scored for latency/throughput/GPU AND accuracy-vs-gold.
  # Run against the NitroGen scenarios:
  #   python -m benchmarks.runner --gpu rtx_pro6000 --sweep nitrogen-backends \
  #       --scenarios-dir tests/smoke/scenarios_nitrogen
  nitrogen-backends:
    rounds:
      - {model: nitrogen-500m-bf16,      backends: [nitrogen-eager]}      # reference
      - {model: nitrogen-500m-bf16,      backends: [nitrogen-compile]}
      - {model: nitrogen-500m-bf16,      backends: [nitrogen-cudagraph]}
      - {model: nitrogen-500m-fp8,       backends: [nitrogen-tensorrt]}
      - {model: nitrogen-500m-fp8,       backends: [nitrogen-onnx]}
      - {model: nitrogen-500m-fp8-4step, backends: [nitrogen-tensorrt]}
      - {model: nitrogen-500m-nvfp4,     backends: [nitrogen-tensorrt]}   # Blackwell-only

  # ─── Video+text inference sweep ───────────────────────────────────────────
  # All four video-capable models × 2 HTTP backends (vllm, sglang) × 3
  # num_frames values. Nemotron-Omni is vllm-only on this GPU (SGLang fused-MoE
  # OOM on SM_120). TRT-LLM excluded for all (multimodal arch gaps on 1.2.1).
  #
  # `num_frames` is a per-request extra_body parameter (not a server launch flag)
  # passed by VideoTextReasoner.
  #
  # `video`     — full matrix: all models × all frame counts (default, recommended)
  # `video-4f`  — pin at 4 frames only (quick targeted run)
  # `video-8f`  — pin at 8 frames only
  # `video-16f` — pin at 16 frames only
  #
  #   bench sweep --gpu rtx_pro6000 --sweep video \
  #       --scenarios-dir tests/smoke/scenarios_video

  video:
    # Full matrix: 4 models × 2-3 backends × 3 frame counts = 21 rounds.
    # Groups by frame count so results in summary.md are easy to compare.
    rounds:
      # — 4 frames: fastest; good for short clips or obvious single-moment events —
      - {model: qwen3-vl-32b-fp8,       backends: [vllm, sglang], num_frames: 4}
      - {model: qwen3-vl-30b-a3b-fp8,   backends: [vllm, sglang], num_frames: 4}
      - {model: gemma-4-31b-it-fp8,     backends: [vllm, sglang], num_frames: 4}
      - {model: nemotron-omni-fp8,       backends: [vllm],         num_frames: 4}
      # — 8 frames: balanced default; recommended starting point —
      - {model: qwen3-vl-32b-fp8,       backends: [vllm, sglang], num_frames: 8}
      - {model: qwen3-vl-30b-a3b-fp8,   backends: [vllm, sglang], num_frames: 8}
      - {model: gemma-4-31b-it-fp8,     backends: [vllm, sglang], num_frames: 8}
      - {model: nemotron-omni-fp8,       backends: [vllm],         num_frames: 8}
      # — 16 frames: highest temporal coverage; p50 latency ~2x vs 8f —
      - {model: qwen3-vl-32b-fp8,       backends: [vllm, sglang], num_frames: 16}
      - {model: qwen3-vl-30b-a3b-fp8,   backends: [vllm, sglang], num_frames: 16}
      - {model: gemma-4-31b-it-fp8,     backends: [vllm, sglang], num_frames: 16}
      - {model: nemotron-omni-fp8,       backends: [vllm],         num_frames: 16}

  video-4f:
    # Targeted run — 4 frames only, all models. Use when you already know 4f is your budget.
    rounds:
      - {model: qwen3-vl-32b-fp8,       backends: [vllm, sglang], num_frames: 4}
      - {model: qwen3-vl-30b-a3b-fp8,   backends: [vllm, sglang], num_frames: 4}
      - {model: gemma-4-31b-it-fp8,     backends: [vllm, sglang], num_frames: 4}
      - {model: nemotron-omni-fp8,       backends: [vllm],         num_frames: 4}

  video-8f:
    # Targeted run — 8 frames only, all models.
    rounds:
      - {model: qwen3-vl-32b-fp8,       backends: [vllm, sglang], num_frames: 8}
      - {model: qwen3-vl-30b-a3b-fp8,   backends: [vllm, sglang], num_frames: 8}
      - {model: gemma-4-31b-it-fp8,     backends: [vllm, sglang], num_frames: 8}
      - {model: nemotron-omni-fp8,       backends: [vllm],         num_frames: 8}

  video-16f:
    # Targeted run — 16 frames only, all models.
    rounds:
      - {model: qwen3-vl-32b-fp8,       backends: [vllm, sglang], num_frames: 16}
      - {model: qwen3-vl-30b-a3b-fp8,   backends: [vllm, sglang], num_frames: 16}
      - {model: gemma-4-31b-it-fp8,     backends: [vllm, sglang], num_frames: 16}
      - {model: nemotron-omni-fp8,       backends: [vllm],         num_frames: 16}

  # Full matrix — every model × every variant on the relevant backends.
  # Variants here are vllm-only; rounds without a variant run on all three.
  full:
    rounds:
      - {model: qwen3-vl-32b-fp8}
      - {model: qwen3-vl-32b-fp8,  variant: eager,       backends: [vllm]}
      - {model: qwen3-vl-32b-fp8,  variant: chunked_off, backends: [vllm]}
      # - {model: qwen3-vl-32b-bf16}
      - {model: qwen3-vl-30b-a3b-fp8}   # trtllm dropped via unsupported_backends
      - {model: qwen3.6-27b-fp8}        # trtllm dropped via unsupported_backends
      - {model: gemma-4-31b-it-fp8}     # trtllm dropped via unsupported_backends (until bump)
      - {model: nemotron-omni-fp8}      # sglang+trtllm dropped via unsupported_backends

# ─── Workloads (contention study) ──────────────────────────────────────
# What each tenant sends. Adopted verbatim from the
# experiment_config.json `prompts` + `prompt_to_data_mapping`, so the
# request shapes are theirs, not invented here.
#
# A tenant references one of these by name; the orchestrator hands the
# files to whichever driver that tenant uses (aiperf `--input-file`, or
# perf_analyzer `--input-data`).
workloads:
  # Text-only. Output length is a study dimension: 32 vs 512 tokens.
  llm_short:
    prompts: ["workspace/contention/prompts/llm_short.jsonl"]   # 3 prompts, 4-8 tok each
    output_tokens: 32
  llm_long:
    prompts: ["workspace/contention/prompts/llm_long.jsonl"]    # 2 prompts, ~970-990 tok each
    output_tokens: 512
  # Long prompt, SHORT output. Exists so the prompt-length dimension can be
  # swept without dragging output length along with it: llm_short → llm_long
  # changes both at once, so it can only answer "does more work cost more",
  # never "is prefill or decode the thing that contends".
  llm_long_prompt:
    prompts: ["workspace/contention/prompts/llm_long.jsonl"]    # ~970-990 tok prefill
    output_tokens: 32

  # Video. Frame count IS the VLM input-size dimension — the 40-frame clip
  # is the sustained prefill burst other tenants are measured against.
  vlm_video_short:
    prompts: ["workspace/contention/prompts/vlm_video.jsonl"]
    data: ["workspace/contention/test_data/vlm/clip_3s_224.mp4"]    # 224², 1 fps, 3 frames
    output_tokens: 128
  vlm_video_long:
    prompts: ["workspace/contention/prompts/vlm_video.jsonl"]
    data: ["workspace/contention/test_data/vlm/clip_10s_720p.mp4"]  # 720p, 4 fps, 40 frames
    output_tokens: 128

  # Document understanding (image-LM tenant).
  ilm_document:
    prompts: ["workspace/contention/prompts/ilm_document.jsonl"]
    data: ["workspace/contention/test_data/cv/sample_document.png"]
    output_tokens: 256

  # CV. 640² is YOLO-native and is the default where input size isn't swept;
  # 320²/1280² are the two ends of the CV input-size dimension.
  cv_detect_default:
    data: ["workspace/contention/test_data/cv/sample_640x640.jpg"]
  cv_detect_small:
    data: ["workspace/contention/test_data/cv/sample_320x320.jpg"]
  cv_detect_large:
    data: ["workspace/contention/test_data/cv/sample_1280x1280.jpg"]
  # DINOv2 is pinned to 224² — its patch grid is fixed, so sweeping input
  # size there would change the model's token count rather than its pixel
  # load, which is a different experiment.
  cv_embed:
    data: ["workspace/contention/test_data/cv/sample_224x224.jpg"]
  cv_ocr:
    data: ["workspace/contention/test_data/cv/sample_document.png"]

# ─── Colocations (contention study) ────────────────────────────────────
# A colocation is one timed window with N tenants sharing this GPU.
# `--emit-colocations <name>` expands it; solo baselines come first.
#
# LOAD IS OPEN-LOOP (`rps`), never concurrency. A closed-loop client
# throttles itself in proportion to the slowdown being measured, so the
# degradation ratio would describe the harness rather than the GPU. Where
# `achieved_rps` falls below `rps`, that crossing IS the safe-operating
# envelope. See the design-decisions reference in the skill.
#
# Composition: `extends` inherits a base (tenants merge by name),
# `rps_sweep` expands one tenant's rate — or every tenant's together with
# `tenant: "*"`, which is what a saturation curve needs — `vary` expands any
# tenant field, and `repetitions` re-runs each window N times.
# Phases match workspace/contention/experiment_design.md.
#
# Placement: a tenant may set `device: 0` (one card) or `device: [0, 1]`
# (tensor parallel across both). Omitted means GPU 0 — this box has one
# card, so nothing below sets it. The VRAM sum is enforced per GPU, and a
# tensor-parallel tenant charges its fraction to every card it occupies.
colocations:

  # ── Phase 2 — same-category load sweeps ────────────────────────────
  # docs/contention.md §3 predicts that two tenants leaning on the SAME
  # resource fight hardest, and that two leaning on different ones can
  # overlap almost for free. Every other colocation in this file is
  # cross-category, so the prediction has nothing to be checked against —
  # these four are the same-resource half of the comparison.
  #
  # The load is swept on `tenant: "*"` — every tenant together. The question
  # here is where the PAIR saturates the card, which is a curve in aggregate
  # offered load; sweeping one tenant against a fixed neighbour would be a
  # cross-* experiment wearing this one's name. Where achieved_rps falls
  # below offered_rps is the saturation point Phase 2 was looking for, and
  # the rps=50 rung is the fixed-load point Phase 3's `*-only` mixes asked
  # for — same run, so it is not run twice.

  # Two text LLMs: both bandwidth-bound in decode, both streaming their whole
  # weight matrix per token. Does a shared bottleneck cost more than a
  # divided one?
  same-llm:
    phase: 2
    duration_s: 120
    isolation: mps
    solo_baselines: auto
    # Both caps derived: 7b → 0.39, gemma2-9b → 0.42, so the pair reserves
    # 0.81 of the card and each gets the same 20 GB of KV. A fixed fraction
    # would have handed the larger model the smaller cache and the curve
    # would have measured that instead.
    kv_budget_gb: 20.0
    tenants:
      - name: llm_a
        backend: vllm
        model: qwen2.5-7b
        workload: llm_short
        load: {pattern: poisson, rps: 4}
      - name: llm_b
        backend: vllm
        model: gemma2-9b        # different vendor, same resource profile
        workload: llm_short
        load: {pattern: poisson, rps: 4}
    rps_sweep: {tenant: "*", values: [1, 4, 16, 64]}

  # Two CV models on one Triton: a launch-bound detector next to a
  # bandwidth-bound embedder. Both are millisecond-scale, so this is also
  # where the §3 asymmetry bites hardest — a 5 ms model pushed to 15 ms is a
  # 3x regression that an LLM at the same absolute interference would not
  # notice. 200 rps is where Triton's own queueing should appear first.
  same-cv:
    phase: 2
    duration_s: 120
    isolation: mps
    solo_baselines: auto
    tenants:
      - name: cv_a
        backend: triton
        model: yolov8-l
        triton_backend: tensorrt
        workload: cv_detect_default
        load: {pattern: poisson, rps: 50}
      - name: cv_b
        backend: triton
        model: dinov2-base
        triton_backend: tensorrt
        workload: cv_embed
        load: {pattern: poisson, rps: 50}
    rps_sweep: {tenant: "*", values: [1, 10, 50, 200]}

  # Two video VLMs — two periodic compute tsunamis on one card. The
  # interesting case is when the two prefill bursts land on top of each
  # other rather than interleaving.
  #
  # SUBSTITUTION: the original second VLM (`gemma-vlm-32b` →
  # paligemma2-28b) is image-only and cannot serve a video workload at all
  # (§9 of docs/contention-coverage.md), so it cannot be the second tenant
  # of a *video* VLM pair. `qwen2.5-vl-7b` is the only video VLM in the
  # contention roster, so the neighbour comes from the headline roster:
  # `gemma-4-31b-it-fp8` is dense, video-capable, and from a different
  # vendor — which keeps the cross-vendor check the original
  # pick was carrying.
  #
  # Rates are low because one 40-frame clip is several hundred ms of
  # sustained prefill; 4 rps of that from two tenants already exceeds the
  # card, which is the point of the top rung.
  same-vlm:
    phase: 2
    duration_s: 180
    isolation: mps
    solo_baselines: auto
    # 16 GB rather than the usual 20: the two video VLMs are 38 GB of weights
    # between them, and a video request's KV is dominated by the several
    # thousand tokens 40 frames expand into, not by the prompt.
    kv_budget_gb: 16.0
    tenants:
      - name: vlm_a
        backend: vllm
        model: qwen2.5-vl-7b
        workload: vlm_video_long
        load: {pattern: poisson, rps: 1}   # cap derived → 0.26

      - name: vlm_b
        backend: vllm
        # Was gemma-4-31b-it-fp8: vLLM registers the arch but transformers
        # 4.57.6 does not, so it never loaded — 8 failed runs. The customer's
        # own pick, gemma-vlm-32b, is paligemma2-28b and is image-only, so it
        # cannot serve vlm_video_long at all (see its unsupported_workloads).
        # qwen3-vl-32b-fp8 is this roster's other video-capable 32B and serves
        # today. same-vlm tests same-CATEGORY, not cross-vendor, so a Qwen pair
        # is not a confound.
        model: qwen3-vl-32b-fp8
        workload: vlm_video_long
        # No explicit cap now: qwen3-vl-32b-fp8 carries weights_gb, so the cap
        # derives from the colocation's KV budget and BOTH tenants get an
        # absolute --kv-cache-memory-bytes. A cap here would be a total-device
        # target next to a co-resident neighbour, which is what broke
        # cross-vlm-prefill-vs-llm and the whole memory-pressure family.
        load: {pattern: poisson, rps: 1}
    rps_sweep: {tenant: "*", values: [0.5, 1, 2, 4]}

  # Two document/image models: high-resolution stills through a vision
  # encoder, heavy but far steadier than video. If §3 is right, this pair
  # should degrade more gracefully than same-vlm and less gracefully than a
  # cross-category pair at the same offered load.
  #
  # kosmos-2.5 is on Triton's python backend because no vLLM or SGLang
  # implementation exists — so its absolute latencies are a serving-path
  # artifact, not a contention finding. Its RATIO is still valid; that is
  # the whole reason the study reports ratios.
  same-ilm:
    phase: 2
    duration_s: 600
    isolation: mps
    solo_baselines: auto
    kv_budget_gb: 20.0
    tenants:
      - name: ilm_a
        backend: triton
        model: kosmos-2.5
        triton_backend: python
        workload: ilm_document
        load: {pattern: poisson, rps: 0.1}
      - name: ilm_b
        backend: vllm
        model: qwen2.5-vl-7b       # serving images here, not video
        workload: ilm_document
        load: {pattern: poisson, rps: 2}
    # Scaled to the ILM tenant's MEASURED ceiling. kosmos-2.5 takes
    # 2205 ms per 256-token document request on a PRO 6000, i.e. ~0.45
    # rps from one instance, so the old [1,2,4,8] sat entirely above
    # saturation: every point would have measured a queue rather than
    # contention. This walks from headroom through the knee.
    rps_sweep: {tenant: "*", values: [0.03, 0.06, 0.1, 0.2]}

  # ── Phase 3 — model type mix ───────────────────────────────────────
  mix-llm-cv:
    phase: 3
    duration_s: 120
    isolation: mps
    solo_baselines: auto
    tenants:
      - name: llm
        backend: vllm
        model: qwen2.5-7b
        workload: llm_short
        # Explicit cap. vLLM defaults to 0.90 and would take the whole card,
        # leaving the CV tenant to OOM at startup.
        gpu_memory_utilization: 0.45
        load: {pattern: poisson, rps: 4}
      - name: cv
        backend: triton
        model: yolov8-l
        triton_backend: tensorrt
        workload: cv_detect_default
        load: {pattern: poisson, rps: 50}

  # Tenants are spelled out rather than inherited from mix-llm-cv. `extends`
  # merges tenants BY NAME, so overriding its `llm` tenant would have forced
  # the name "llm" onto a VLM — and that label is what lands in the manifest
  # and every summary row, where a reader would take it for a text model.
  mix-vlm-cv:
    phase: 3
    duration_s: 120
    isolation: mps
    solo_baselines: auto
    tenants:
      - name: vlm
        backend: vllm
        model: qwen2.5-vl-7b
        workload: vlm_video_long     # 40-frame encode = the prefill burst
        gpu_memory_utilization: 0.50
        load: {pattern: poisson, rps: 1}
      - name: cv
        backend: triton
        model: dinov2-base           # bandwidth-bound neighbour
        triton_backend: tensorrt
        workload: cv_embed
        load: {pattern: poisson, rps: 50}

  # Spelled out for the same reason as mix-vlm-cv: inheriting would have named
  # a document model "llm".
  mix-ilm-cv:
    phase: 3
    duration_s: 600
    isolation: mps
    solo_baselines: auto
    tenants:
      - name: ilm
        backend: triton              # kosmos-2.5 has no vLLM/SGLang support
        model: kosmos-2.5
        triton_backend: python
        workload: ilm_document
        load: {pattern: poisson, rps: 0.1}
      - name: cv
        backend: triton
        model: yolov8-l
        triton_backend: tensorrt
        workload: cv_detect_default
        load: {pattern: poisson, rps: 50}

  # Video VLM next to a document model — the two compute-heavy categories,
  # with no bandwidth-bound tenant between them to absorb the burst. §3
  # predicts this is the pairing to avoid when packing GPUs, and Phase 5's
  # predicted-worst placement (P2/P3) rests on that prediction being true.
  # Same VLM substitution as `same-vlm`: paligemma2 cannot serve video.
  mix-vlm-ilm:
    phase: 3
    duration_s: 600
    isolation: mps
    solo_baselines: auto
    kv_budget_gb: 20.0
    tenants:
      - name: vlm
        backend: vllm
        model: qwen2.5-vl-7b
        workload: vlm_video_long     # 40-frame encode = the prefill burst
        load: {pattern: poisson, rps: 1}
      - name: ilm
        backend: triton              # kosmos-2.5 has no vLLM/SGLang support
        model: kosmos-2.5
        triton_backend: python
        workload: ilm_document
        load: {pattern: poisson, rps: 0.1}

  # All four categories at once — the only 4-tenant window in the study.
  # Every other colocation answers "do these two fit together"; this one
  # answers "does the whole stack fit on one card", which is the question a
  # the deployment actually has. It is also the prerequisite for Phase 5: with
  # four tenants and two GPUs there are exactly three pairings to rank, and
  # without this window there is no 1-GPU number to rank them against.
  #
  # Caps derived from a 20 GB KV budget: 0.39 (llm) + 0.30 (vlm) = 0.69,
  # leaving ~30 GB for the two Triton tenants. The two LLM/VLM tenants keep
  # the same 20 GB KV they get in the 2-tenant windows, which is the only
  # way the 4-tenant degradation is attributable to the extra neighbours
  # rather than to a cache that shrank underneath them (§2b).
  mix-full:
    phase: 3
    duration_s: 600
    isolation: mps
    solo_baselines: auto
    kv_budget_gb: 20.0
    tenants:
      - name: llm
        backend: vllm
        model: qwen2.5-7b
        workload: llm_short
        load: {pattern: poisson, rps: 4}
      - name: vlm
        backend: vllm
        model: qwen2.5-vl-7b
        workload: vlm_video_long
        load: {pattern: poisson, rps: 1}
      - name: ilm
        backend: triton
        model: kosmos-2.5
        triton_backend: python
        workload: ilm_document
        load: {pattern: poisson, rps: 0.1}
      - name: cv
        backend: triton
        model: yolov8-l
        triton_backend: tensorrt
        workload: cv_detect_default
        load: {pattern: poisson, rps: 50}

  # ── Phase 4 — cross-type contention: sweep the neighbour's load ────
  # The knee in the subject's latency against CV rate is the disruption
  # threshold; where achieved_rps < offered_rps is the envelope boundary.
  cross-llm-vs-cv-rps:
    phase: 4
    extends: mix-llm-cv
    rps_sweep: {tenant: cv, values: [1, 10, 50, 200]}

  # Same sweep, ILM as the subject. A document model holds its vision
  # encoder busy for far longer per request than a text LLM does, so the
  # question is whether the CV knee arrives at the same rate or earlier —
  # i.e. whether the disruption threshold is a property of the card or of
  # the tenant being disrupted.
  cross-ilm-vs-cv:
    phase: 4
    extends: mix-ilm-cv
    rps_sweep: {tenant: cv, values: [1, 10, 50, 200]}

  # CV as the SUBJECT for once. Everywhere else CV is the aggressor, which
  # only ever answers half of §3's asymmetry claim: a 5 ms detector pushed
  # to 15 ms is a 3x regression while the LLM beside it barely moves, and
  # that direction is invisible until the detector is the one being watched.
  #
  # REFRAMED: the original design specified this as an LLM *concurrency* sweep. A
  # closed-loop neighbour throttles itself in proportion to the slowdown it
  # is causing, so the aggression level would have been set by the harness
  # rather than by us — the ratio would describe the load generator. Swept
  # as offered rate instead; the intent (turn the LLM's pressure up in four
  # steps) is unchanged.
  cross-cv-vs-llm-rps:
    phase: 4
    extends: mix-llm-cv
    rps_sweep: {tenant: llm, values: [1, 4, 16, 64]}

  cross-vlm-prefill-vs-llm:
    phase: 4
    duration_s: 180
    isolation: mps
    solo_baselines: auto
    # Two vLLM tenants on one card, so the caps cannot be load-bearing: a cap
    # is a total-device target and the second tenant to start subtracts the
    # first's resident memory from its own allowance. With explicit caps of
    # 0.45/0.35 the llm tenant derived a negative cache and never became ready.
    # KV is held constant here (it is not what this colocation varies), so state
    # the budget once and let each cap absorb only its own weights.
    kv_budget_gb: 20.0
    tenants:
      - name: vlm
        backend: vllm
        model: qwen2.5-vl-7b
        workload: vlm_video_long
        load: {pattern: poisson, rps: 1}
      - name: llm
        backend: vllm
        model: gemma2-9b
        workload: llm_short
        load: {pattern: poisson, rps: 4}

  # Same architecture, four sizes — is contention vulnerability a function
  # of model size? (Consumer tier keeps 7b/14b; 32b/72b need this GPU.)
  #
  # The inherited fixed 0.45 cap cannot answer that question. 0.45 × 96 GB
  # = 43 GB, which qwen2.5-72b-AWQ (45 GB of weights) cannot even load —
  # and where a rung does load, a fixed fraction hands each one a
  # different KV cache, so the ladder would measure memory allocation, not
  # size. Dropping the explicit cap derives it per rung from `kv_budget_gb`
  # (docs/contention.md §2b): the KV cache is identical at every rung and
  # only the weights move. 16 GB is what the heaviest rung permits —
  # qwen2.5-32b at BF16 is 65.5 GB, more than the 72b at AWQ — and still
  # leaves the CV tenant ~12 GB there.
  cross-size-scaling:
    phase: 4
    extends: mix-llm-cv
    kv_budget_gb: 16.0
    tenants:
      - name: llm
        gpu_memory_utilization: null   # derive per rung; see kv_budget_gb above
    vary:
      tenant: llm
      field: model
      values: [qwen2.5-7b, qwen2.5-14b, qwen2.5-32b, qwen2.5-72b]

  # Does contention behaviour generalise beyond Qwen? If all three agree
  # within ~20%, the size-scaling conclusions carry.
  cross-arch-validation:
    phase: 4
    extends: mix-llm-cv
    vary:
      tenant: llm
      field: model
      values: [qwen2.5-7b, llama3.1-8b, mistral-7b]

  # ── Phase 4 — the KV-cache cliff ───────────────────────────────────
  # Where does the KV cache get small enough that vLLM starts evicting and
  # preempting rather than batching? Below that point co-residency costs a
  # little throughput; above it, requests queue and the latency curve turns
  # vertical. The question is where that knee sits, because it is
  # the number that decides whether a second tenant is affordable at all.
  #
  # HOW THIS DIFFERS FROM THE CUSTOMER'S DESIGN, and why.
  # Their ladder swaps in a bigger neighbour at each rung — (72b,7b),
  # (72b,14b), (72b,32b), (vl-72b,72b) — so each point changes TWO things:
  # how full the card is, AND which model is being measured. When
  # throughput drops at a rung you cannot tell whether the KV cache got too
  # small (the question) or whether a 32B model is simply slower than a 7B
  # one (true regardless of memory, and not contention at all).
  #
  # Here the MODELS ARE FIXED and only the caps move. The KV cache is then
  # the single independent variable, so a throughput drop has exactly one
  # possible cause. It also yields a TRANSFERABLE number — "throughput
  # degrades below N GB of KV" — which can be checked against any future
  # model pair against, instead of four outcomes for four specific pairs.
  #
  # DISQUALIFIED from the original ladder, on this card, with these
  # checkpoints — removed rather than substituted:
  #   · (72b, 32b) = 45.0 + 65.5 = 110.5 GB of weights. Does not load on a
  #     96 GB card. (Their `q4` intent would fit at ~65 GB, but this yaml
  #     carries qwen2.5-32b at BF16 only; no AWQ 32b checkpoint is
  #     registered.)
  #   · (vl-72b, 72b) — `qwen2.5-vl-72b` has no entry in this yaml, and at
  #     BF16 it needs two cards.
  # Their 47% floor is also unreachable: the 72B anchor ALONE is 47%.
  #
  # READ AS ONE CURVE, in this order:
  #   cross-memory-pressure-kv03 → -kv13 → -kv22 → -kv29
  # The suffix is TOTAL KV across both tenants, in GB — the swept variable.
  # Weights + allocator overhead are fixed at 64.2 GB (67% of the card), so
  # KV is everything above that line.
  #
  # ⚠ THE TWO ENDS FAIL DIFFERENTLY, and the naming is deliberate. More KV
  # means MORE of the card reserved, so pressure does NOT rise with the
  # reservation percentage the way the original utilisation numbers did:
  #   · kv03 (70% reserved) — KV starved. This is where the eviction cliff
  #     should appear, and it is the end the experiment is hunting.
  #   · kv29 (97% reserved) — KV ample, but 93 of 96 GB committed. This is
  #     where allocator fragmentation and near-OOM bimodality should appear.
  # A reader who assumes "higher percentage = worse" will read it backwards.
  #
  # WHY EXPLICIT CAPS HERE, against the derive-from-kv_budget_gb rule used
  # everywhere else: that rule exists to hold the KV cache CONSTANT so a
  # comparison isolates the neighbour. Here the KV cache IS the variable.
  # Deriving would pin the exact quantity under test and flatten the curve.
  # Each rung's resulting KV is written beside its cap so a reader can check
  # the arithmetic rather than trust it.
  #
  # The KV split is held at ~2:1 anchor:neighbour at every rung, so the
  # ratio is not a second variable — only the total moves.
  #
  # repetitions: 3 — near-OOM behaviour is bimodal. The model either fits or
  # it thrashes, and the mean of those two states describes neither, so the
  # SPREAD across the three runs is the finding at kv29. Kept at 3 for the
  # lower rungs too, so that spread has something to be compared against.
  #
  # The offered rate is deliberately IDENTICAL at all four points, so a
  # change in throughput is never a change in what was asked for.

  cross-memory-pressure-kv03:
    phase: 4
    duration_s: 120
    isolation: mps
    solo_baselines: auto
    repetitions: 3
    tenants:
      - name: anchor
        backend: vllm
        model: qwen2.5-72b            # AWQ, 45.0 GB weights — fixed all curve
        workload: llm_short
        kv_budget_gb: 2.0             # absolute; cap derived. Composes across tenants.
        load: {pattern: poisson, rps: 2}
      - name: neighbour
        backend: vllm
        model: qwen2.5-7b             # 15.2 GB weights — fixed all curve
        workload: llm_short
        kv_budget_gb: 1.0             # absolute; cap derived. Composes across tenants.
        load: {pattern: poisson, rps: 4}

  cross-memory-pressure-kv13:
    phase: 4
    extends: cross-memory-pressure-kv03
    tenants:
      - name: anchor
        kv_budget_gb: 8.7
      - name: neighbour
        kv_budget_gb: 3.9

  cross-memory-pressure-kv22:
    phase: 4
    extends: cross-memory-pressure-kv03
    tenants:
      - name: anchor
        kv_budget_gb: 14.4
      - name: neighbour
        kv_budget_gb: 7.8

  # Top of the curve: 93 of 96 GB committed. KV is ample here — what is
  # under test at this rung is the allocator, not the cache.
  cross-memory-pressure-kv29:
    phase: 4
    extends: cross-memory-pressure-kv03
    tenants:
      - name: anchor
        kv_budget_gb: 19.2
      - name: neighbour
        kv_budget_gb: 9.7

  # ── Phase 5 — GPU scaling: does a second card remove contention? ───
  # The question is "does adding GPUs eliminate contention or
  # just redistribute it?", and the honest answer depends entirely on where
  # the tenants land. So this phase does not measure "2 GPUs"; it measures
  # PLACEMENT, with the card count held at two.
  #
  # SCOPE: the `device:` field supports up to 8 GPUs, but this study is
  # tested with 2 GPUs only.
  #
  # NO TENSOR-PARALLEL ENTRIES, deliberately. This card records
  # `nvlink: false`, so a TP tenant's cross-card traffic goes over PCIe on
  # every forward pass. Those results would be dominated by the interconnect
  # rather than by the neighbour, which is not what this study reports.
  # Deferred until `nvidia-smi topo -m` on the real box says what the link
  # actually is (docs/contention.md §5, Mode B).

  # ── The three packing pairings (Mode C) ────────────────────────────
  # `mix-full`'s four tenants are the only 4-tenant roster in the study, and
  # over two cards there are exactly three ways to split them:
  #
  #   place-p1   GPU0[LLM + VLM]   GPU1[ILM + CV]
  #   place-p2   GPU0[LLM + ILM]   GPU1[VLM + CV]
  #   place-p3   GPU0[LLM + CV]    GPU1[VLM + ILM]
  #
  # Same four models, same offered rates, same KV budget as `mix-full` —
  # each entry extends it and overrides nothing but `device`. If the ranking
  # comes out as §3's resource-profile heuristic predicts (P1 best, then P3,
  # then P2), the result is a placement RULE that applies to models we
  # never benchmarked, which is worth more than the three numbers.
  #
  # THE ONE THING NOT TO "FIX" HERE: the KV budget is 20 GB in all three,
  # and it is sized for P1 — the tightest case, where both vLLM tenants
  # (LLM 0.39 + VLM 0.30 = 0.69) sit on GPU 0 together. P2 and P3 give each
  # vLLM tenant a card of its own and could afford far more. Handing them
  # more is exactly the mistake docs/contention.md §2b describes: P1's
  # tenants would run with half the KV cache of P2's and P3's, P1 would come
  # out slowest, and the finding would be about our own memory allocation
  # rather than about who each tenant's neighbour is. Placement is the only
  # variable these three are allowed to differ in — the cache stays put.
  #
  # Per-GPU reservation, which is what the pre-flight now checks (§5):
  #   P1  GPU0 0.39 + 0.30 = 0.69   GPU1 0.00 (both tenants are Triton)
  #   P2  GPU0 0.39  + Triton ILM   GPU1 0.30 + Triton CV
  #   P3  GPU0 0.39  + Triton CV    GPU1 0.30 + Triton ILM

  # Predicted BEST: the two compute-heavy tenants (VLM, ILM) are separated,
  # and the LLM's bandwidth-bound decode overlaps the VLM's compute burst.
  place-p1:
    phase: 5
    extends: mix-full
    kv_budget_gb: 20.0        # P1-sized, and identical in p2/p3 — see above
    tenants:
      - {name: llm, device: 0}
      - {name: vlm, device: 0}
      - {name: ilm, device: 1}
      - {name: cv,  device: 1}

  # Predicted WORST: the VLM's prefill burst lands on the CV detector, the
  # most fragile tenant in the set — a 5 ms model pushed to 15 ms is a 3x
  # regression, while the burst that caused it barely notices (§3).
  place-p2:
    phase: 5
    extends: mix-full
    kv_budget_gb: 20.0
    tenants:
      - {name: llm, device: 0}
      - {name: ilm, device: 0}
      - {name: vlm, device: 1}
      - {name: cv,  device: 1}

  # Predicted MIDDLE: VLM and ILM are both compute-heavy and share a card,
  # but the tenant they damage is another heavy model rather than a
  # millisecond-scale one.
  place-p3:
    phase: 5
    extends: mix-full
    kv_budget_gb: 20.0
    tenants:
      - {name: llm, device: 0}
      - {name: cv,  device: 0}
      - {name: vlm, device: 1}
      - {name: ilm, device: 1}

  # ── Separate GPUs (Mode A) ─────────────────────────────────────────
  # `mix-llm-cv`, unchanged except that the two tenants are on different
  # cards. It answers two questions at once.
  #
  # First: what does buying a second GPU actually get me?
  # This is the before/after against the 1-GPU `mix-llm-cv` — same models,
  # same rates, same 0.45 cap, so the only difference is the extra card.
  #
  # Second, it is the HARDWARE NULL TEST. With no shared SMs, no shared
  # bandwidth and no shared VRAM there is nothing left to contend over, so
  # every degradation ratio here must come back ≈1.0. If a tenant still
  # degrades against a neighbour on a different card, that is a bug in the
  # harness — not contention — and this is the run that catches it.
  place-isolated:
    phase: 5
    extends: mix-llm-cv
    tenants:
      - {name: llm, device: 0}
      - {name: cv,  device: 1}

  # The second before/after, and the one worth having: `cross-vlm-prefill-
  # vs-llm` is the sharpest contention signal in the study — the LLM's ITL
  # P99 spikes inside the VLM's prefill window. Split across two cards, does
  # the spike disappear entirely, or does something (PCIe, host, MPS) carry
  # it over? Caps stay at the 1-GPU values (0.45 / 0.35) so the comparison
  # is against a baseline with the same KV cache, not a roomier one (§2b).
  #
  # Deliberately only two repeats of 1-GPU scenarios, not a fan-out over the
  # whole file: the placement question is answered by the three pairings
  # above, and these exist to anchor them to a known 1-GPU number.
  place-vlm-prefill-split:
    phase: 5
    extends: cross-vlm-prefill-vs-llm
    tenants:
      - {name: vlm, device: 0}
      - {name: llm, device: 1}

  # ── Phase 6 — secondary dimensions ─────────────────────────────────
  # Every dimension below runs against TWO contrasting baselines, `-a` and
  # `-b`. That is the original design and it is the point of the phase: a
  # secondary dimension measured against one baseline gives a main effect,
  # and the thing worth knowing is the INTERACTION. "TensorRT beats the
  # python backend by 1.4x" is a fact about Triton; "it beats it by 1.4x
  # normally and by 4x once the card is memory-bound" is a deployment rule,
  # and only the pair can produce it.
  #
  #   -a  extends mix-llm-cv       — COMPUTE-bound: small models, high rate,
  #                                  ~35 GB reserved, cache room to spare.
  #   -b  extends mix-memory-bound — MEMORY-bound: 72B + 14B + a detector at
  #                                  moderate rate, ~90 GB reserved.
  #
  # A dimension that behaves the same in both is a safe generalisation; one
  # that flips between them is a finding, and the flip is invisible with a
  # single baseline.

  # Baseline B. `mix-llm-cv` above is baseline A — same three resource
  # roles (a driving LLM, a second LLM, a detector), pushed against VRAM
  # instead of against the clock.
  #
  # kv_budget_gb: 6.0, well under the 20 GB the compute-bound colocations
  # get, because that is what memory-bound MEANS here: 45.0 + 29.5 = 74.5
  # GB of weights leaves 21.5 GB for two caches, two overheads and the CV
  # tenant. Derived: 0.55 (72b) + 0.39 (14b) = 0.94, ~5.8 GB left for
  # Triton. Held constant across every `-b` run, so the pair of baselines
  # differ in memory pressure and in nothing else that we chose.
  mix-memory-bound:
    phase: 6
    duration_s: 120
    isolation: mps
    solo_baselines: auto
    kv_budget_gb: 6.0
    tenants:
      - name: llm
        backend: vllm
        model: qwen2.5-72b           # AWQ 45.0 GB — the memory anchor
        workload: llm_short
        load: {pattern: poisson, rps: 2}
      - name: llm2
        backend: vllm
        model: qwen2.5-14b
        workload: llm_short
        load: {pattern: poisson, rps: 2}
      - name: cv
        backend: triton
        model: yolov8-l
        triton_backend: tensorrt
        workload: cv_detect_default
        load: {pattern: poisson, rps: 50}

  # Does the serving backend matter more when memory is tight? vLLM and
  # SGLang size and evict their KV caches differently, and that difference
  # has nothing to lean on until the cache is the scarce resource.
  secondary-backend-llm-a:
    phase: 6
    extends: mix-llm-cv
    vary: {tenant: llm, field: backend, values: [vllm, sglang]}

  secondary-backend-llm-b:
    phase: 6
    extends: mix-memory-bound
    vary: {tenant: llm, field: backend, values: [vllm, sglang]}

  # Is an optimised CV execution path worth more, or less, when its
  # neighbour is starving the card? TensorRT buys its speed partly by
  # holding more workspace — which is cheap on baseline A and may not be
  # on baseline B.
  # `python` is NOT a rung here: only kosmos-2.5 has a hand-authored model.py,
  # and yolov8-l fails at staging with "is a python-backend model but has no
  # model.py". The question this dimension asks is what the Triton backend
  # costs under contention, which tensorrt-vs-onnx answers; a Python-backend
  # YOLO would be slower for reasons that have nothing to do with a neighbour.
  secondary-backend-cv-a:
    phase: 6
    extends: mix-llm-cv
    vary: {tenant: cv, field: triton_backend, values: [tensorrt, onnx]}

  secondary-backend-cv-b:
    phase: 6
    extends: mix-memory-bound
    vary: {tenant: cv, field: triton_backend, values: [tensorrt, onnx]}

  # Long outputs hold KV entries alive for longer. Under baseline A that is
  # free; under B it is the difference between batching and preempting.
  secondary-output-length-a:
    phase: 6
    extends: mix-llm-cv
    vary: {tenant: llm, field: workload, values: [llm_short, llm_long]}

  secondary-output-length-b:
    phase: 6
    extends: mix-memory-bound
    vary: {tenant: llm, field: workload, values: [llm_short, llm_long]}

  secondary-input-size-cv-a:
    phase: 6
    extends: mix-llm-cv
    vary: {tenant: cv, field: workload, values: [cv_detect_small, cv_detect_large]}

  secondary-input-size-cv-b:
    phase: 6
    extends: mix-memory-bound
    vary: {tenant: cv, field: workload, values: [cv_detect_small, cv_detect_large]}

  # The LLM-side twin of the CV input-size dimension, and a different
  # question from `secondary-output-length`: a 20x longer PROMPT is a
  # bigger prefill burst — a compute spike — while a longer output is more
  # bandwidth-bound decode. Same tenant, opposite resource. It is the
  # cheapest available approximation of what makes a video VLM the worst
  # neighbour in the study, using a text model where the burst can be
  # turned up on its own.
  # Both rungs emit 32 tokens (see `llm_long_prompt`), so only the prefill
  # moves; sweeping llm_short → llm_long would move both at once.
  secondary-input-size-llm-a:
    phase: 6
    extends: mix-llm-cv
    vary: {tenant: llm, field: workload, values: [llm_short, llm_long_prompt]}

  secondary-input-size-llm-b:
    phase: 6
    extends: mix-memory-bound
    vary: {tenant: llm, field: workload, values: [llm_short, llm_long_prompt]}

  # Noisy-neighbour fairness: does the heavy user starve the light one?
  # 1:1 / 4:1 / 16:1 against a fixed LLM rate of 4 rps.
  secondary-asymmetry-a:
    phase: 6
    extends: mix-llm-cv
    rps_sweep: {tenant: cv, values: [4, 16, 64]}

  # Against baseline B the ratios are 2:1 / 8:1 / 32:1 — the LLM anchor
  # runs at 2 rps, not 4 — so the fairness question is asked of a tenant
  # that has no cache headroom to absorb a burst with.
  secondary-asymmetry-b:
    phase: 6
    extends: mix-memory-bound
    rps_sweep: {tenant: cv, values: [4, 16, 64]}

  # Bursty arrivals need somewhere to queue. Under baseline A that is a
  # scheduling question; under B the queue competes with the weights for
  # the same VRAM.
  secondary-arrival-a:
    phase: 6
    extends: mix-llm-cv
    vary: {tenant: cv, field: load, values: [{pattern: poisson, rps: 50}, {pattern: constant, rps: 50}]}

  secondary-arrival-b:
    phase: 6
    extends: mix-memory-bound
    vary: {tenant: cv, field: load, values: [{pattern: poisson, rps: 50}, {pattern: constant, rps: 50}]}

